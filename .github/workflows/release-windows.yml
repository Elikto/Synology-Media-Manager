name: Build and publish Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'update.json'
      - '.github/workflows/release-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: synology-windows-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate release version and source checksum
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw update.json | ConvertFrom-Json
          if ($manifest.version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version" }
          $actual = (Get-FileHash -LiteralPath SynologyMediaManager.pyw -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Source SHA-256 on Windows: $actual"
          if ($actual -ne $manifest.sha256) { throw "Source checksum mismatch" }
          $expectedVersion = 'VERSION = "' + $manifest.version + '"'
          if (-not (Select-String -LiteralPath SynologyMediaManager.pyw -Pattern $expectedVersion -SimpleMatch -Quiet)) {
            throw "App version differs from update.json"
          }
          "APP_VERSION=$($manifest.version)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Python unit tests
        shell: pwsh
        run: |
          python -m py_compile SynologyMediaManager.pyw
          python -m unittest discover -s tests -v

      - name: Install PyInstaller
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0

      - name: Build standalone Windows application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name SynologyMediaManager SynologyMediaManager.pyw
          if (-not (Test-Path -LiteralPath dist/SynologyMediaManager.exe)) { throw "EXE missing" }
          $length = (Get-Item -LiteralPath dist/SynologyMediaManager.exe).Length
          if ($length -lt 100000) { throw "Executable unexpectedly small" }
          Write-Host "Built EXE ($length bytes)"

      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $sha = (Get-FileHash -LiteralPath dist/SynologyMediaManager.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  SynologyMediaManager.exe" | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding ascii
          Get-Content -LiteralPath dist/SHA256SUMS.txt

      - name: Publish downloadable GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/SynologyMediaManager.exe dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag dist/SynologyMediaManager.exe dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Synology Media Manager $tag" --notes "Application portable Windows (.exe) : double-cliquer, Python n'est pas requis. Cette version effectue l'audit DSM en lecture seule, et propose les mises à jour dans l'application. Exécutable non signé : Windows SmartScreen peut demander une confirmation." --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publication failed" }
          Write-Host "Published https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/SynologyMediaManager.exe"
